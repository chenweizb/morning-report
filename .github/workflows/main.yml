name: 早报自动发送（北京时间7:45）
on:
  # 手动触发测试按钮
  workflow_dispatch:
  # 定时触发：北京时间每天早上7:45（无需换算UTC，直接写北京时间）
  schedule:
    - cron: '45 7 * * *'
      timezone: 'Asia/Shanghai'
jobs:
  send_report:
    runs-on: ubuntu-latest
    steps:
      # 第一步：拉取仓库所有代码（必须，否则找不到你的daily_morning.py）
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第二步：配置Python 3.10环境（和你本地版本保持一致）
      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第三步：安装所有依赖（含akshare，用清华镜像加速，避免海外服务器超时）
      - name: 安装依赖库
        run: |
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple/ requests beautifulsoup4 akshare

      # 第四步：运行你的早报脚本
      - name: 运行早报脚本
        run: python daily_morning.py
