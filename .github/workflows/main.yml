name: 早报自动发送（北京时间7:45）

on:
  # 手动触发测试按钮
  workflow_dispatch:
  # 定时触发：北京时间每天早上7:45
  schedule:
    - cron: '45 7 * * *'
      timezone: 'Asia/Shanghai'

jobs:
  send_report:
    runs-on: ubuntu-latest
    steps:
      # 第一步：拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第二步：配置 Python 3.10
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第三步：强力安装依赖（关键步骤！）
      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests akshare

      # 第四步：运行脚本
      - name: 运行早报脚本
        run: python daily_morning.py
