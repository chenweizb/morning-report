name: 盘前早报+B2.1实盘系统
on:
  workflow_dispatch:  # 支持手动触发
  schedule:
    - cron: '45 23 * * 0-6'  # 北京时间7:45全周推送（UTC+8）
      timezone: 'Asia/Shanghai'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖（用清华镜像加速，避免超时）
        run: |
          python -m pip install --upgrade pip
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple/ akshare requests pandas tushare
      - name: 运行主程序
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}  # 从GitHub Secrets读取Token，不泄露
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}    # 从GitHub Secrets读取Token，不泄露
        run: python daily_morning.py
      - name: 落盘原始数据（自动提交到仓库，供回溯）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_news.txt
          git commit -m "Daily update: $(date +'%Y-%m-%d')" || echo "No changes"
          git push
