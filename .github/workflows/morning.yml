name: 盘前晨报任务
on:
  schedule:
    # UTC时间23:00 = 北京时间早上7点
    - cron: "0 23 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          python3 -m pip install -r requirements.txt
      - name: 运行脚本
        run: python3 morning_report.py
