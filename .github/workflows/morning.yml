name: 07:30 全球晨报
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
      timezone: 'Asia/Shanghai'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 系统依赖 + Python依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev zlib1g-dev python3-dev pkg-config
          python -m pip install --upgrade pip
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple/ -r requirements.txt
          pip install -U akshare
          python -c "import akshare; print('云端AkShare版本:', akshare.__version__)"
      - name: 运行主程序
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
        run: python daily_morning.py
      - name: 落盘
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_news.txt || true
          git commit -m "Daily update: $(date +'%Y-%m-%d')" || true
          git push || true
