name: 07:30 全球晨报
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
      timezone: 'Asia/Shanghai'

jobs:
  run:
    runs-on: ubuntu-22.04
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: 安装系统依赖+Python依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev zlib1g-dev python3-dev pkg-config
          python -m pip install --upgrade pip
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt
      - name: 执行晨报脚本
        run: python daily_morning.py
