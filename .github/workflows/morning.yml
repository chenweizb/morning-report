name: 07:30 全球晨报
on:
  workflow_dispatch: # 支持手动点击触发测试
  schedule:
    - cron: '30 23 * * *'      # UTC23:30 = 北京时间07:30
      timezone: 'Asia/Shanghai'

    jobs:
  run:
    runs-on: ubuntu‑22.04
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      ……后续原有步骤不变
steps:
      - uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev zlib1g-dev python3-dev pkg-config
          python -m pip install --upgrade pip
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple || pip install -r requirements.txt

      - name: 执行晨报脚本
        run: python daily_morning.py
