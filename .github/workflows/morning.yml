name: 盘前早报+B2.1实盘系统
on:
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * 0-6'
      timezone: 'Asia/Shanghai'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖（强制升级akshare到最新版，避免云端接口不一致）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U akshare   # ← 关键：覆盖云端旧版本
          python -c "import akshare; print('akshare版本:', akshare.__version__)"
      - name: 运行主程序
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_morning.py
      - name: 落盘（容错）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_news.txt || true
          git commit -m "Daily update: $(date +'%Y-%m-%d')" || true
          git push || true
