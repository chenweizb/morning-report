name: 盘前早报+B2.1实盘系统
on:
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * 0-6'
      timezone: 'Asia/Shanghai'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖（强制升级akshare，避免云端版本不一致）
        run: |
          python -m pip install --upgrade pip
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple/ -r requirements.txt
          pip install -U akshare  # 强制升级到最新版，匹配官方接口
          python -c "import akshare; print('云端AkShare版本:', akshare.__version__)"
      - name: 运行主程序
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_morning.py
      - name: 落盘原始数据（容错处理）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_news.txt || echo "raw_news.txt不存在，跳过提交"
          git commit -m "Daily update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push || echo "Push failed, no changes"
