name: 07:30 全球晨报
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'      # UTC 23:30 = 北京时间07:30
      timezone: 'Asia/Shanghai'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖（补全lxml系统依赖+强制升级akshare）
        run: |
          # 安装lxml必须的底层C库（Ubuntu特有，解决接口找不到的问题）
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev
          # 安装Python依赖
          python -m pip install --upgrade pip
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple/ -r requirements.txt
          # 强制升级akshare到最新版，避免接口版本不一致
          pip install -U akshare
          # 打印版本，方便排查问题
          python -c "import akshare; print('云端AkShare版本:', akshare.__version__)"
      - name: 运行主程序
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
        run: python daily_morning.py
      - name: 落盘原始数据（容错处理）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_news.txt || echo "raw_news.txt不存在，跳过提交"
          git commit -m "Daily update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push || echo "Push failed, no changes"
